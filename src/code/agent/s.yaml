edition: 3.0.0
name: hello-world-app
access: "quanxi-zijian"

vars: 
  region: "us-east-1"
  imageUrl: "registry.us-east-1.aliyuncs.com/fc-demo2/zijian-test-sd:test-ctr-v8"

resources:
  hello_world:
    component: fc3
    props:
      region: ${vars.region}              
      functionName: "zijian-test-agent"
      runtime: "custom-container"
      description: 'hello world by serverless devs'
      timeout: 600
      memorySize: 32768
      cpu: 8
      diskSize: 61440
      gpuConfig:
        gpuMemorySize: 16384
        gpuType: fc.gpu.tesla.1
      internetAccess: true
      instanceConcurrency: 1
      customContainerConfig:
        image: ${vars.imageUrl}
      vpcConfig: auto
      nasConfig: auto
      logConfig: auto
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            authType: anonymous
            disableURLInternet: false
          triggerName: defaultTrigger
          description: ''
          qualifier: LATEST
          triggerType: http