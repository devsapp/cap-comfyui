[global]
# 主镜像源
index-url = https://mirrors.aliyun.com/pypi/simple/

# 备用镜像源（按优先级）
extra-index-url = 
    https://pypi.tuna.tsinghua.edu.cn/simple/
    https://pypi.mirrors.ustc.edu.cn/simple/

[install]
# 信任的主机列表
trusted-host = 
    mirrors.aliyun.com
    pypi.tuna.tsinghua.edu.cn
    pypi.mirrors.ustc.edu.cn