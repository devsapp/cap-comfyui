edition: 3.0.0 #  命令行YAML规范版本，遵循语义化版本（Semantic Versioning）规范
name: cap-comfyui
access: 'quanxi-zijian'
#access: 'quanxi-devs'
vars:
  region: 'cn-hangzhou'
  name: 'zijian-test-comfyui-8'
  imageUrl: 'registry.cn-hangzhou.aliyuncs.com/ohyee/fc-demo:cap-agent-v14'
  role: 'acs:ram::1431999136518149:role/aliyundevsdefaultrole'
#  role: 'acs:ram::1338904783509062:role/aliyundevsdefaultrole'
  gpuType: 'fc.gpu.tesla.1'
  backendType: 'comfyui'
  baseVersion: 'v0.3.10-alpha.2'
  snapshotName: 'latest'

resources:
  comfyui:
    component: model@0.2.32
    props:
      # 基本配置
      region: '${vars.region}'
      name: '${vars.name}'
      description: '${vars.backendType}函数, 用于调试工作空间'
      logConfig: auto
      httpTrigger: auto
      modelConfig:
        sourceType: multi
        multiModelConfig:
          - type: oss
            region: '${vars.region}'
            bucket: 'dipper-cache-${vars.region}'
            path: '/base/${vars.backendType}/${vars.baseVersion}/'
          - type: oss
            region: '${vars.region}'
            bucket: 'dipper-cache-${vars.region}'
            path: '/models/checkpoints/sd-v1-5-inpainting.ckpt'
            prefix: 'models/checkpoints'
      role: '${vars.role}'
      environmentVariables:
        BACKEND_TYPE: '${vars.backendType}'

      # 挂载存储配置
      nasConfig: auto
      vpcConfig: auto

      # 实例规格
      timeout: 7200
      diskSize: 61440
      cpu: 8
      memorySize: 32768
      gpuConfig:
        gpuMemorySize: 16384
        gpuType: '${vars.gpuType}'

      # 运行时
      customContainerConfig:
        port: 9000
        image: ${vars.imageUrl} 
        instanceConcurrency: 200

      customDomain:
        protocol: HTTP
        route:
          path: /*
          qualifier: LATEST
        domainName: auto
