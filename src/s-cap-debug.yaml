edition: 3.0.0 #  命令行YAML规范版本，遵循语义化版本（Semantic Versioning）规范
name: cap-comfyui
access: 'quanxi-zijian'
vars:
  region: 'us-east-1'
  name: 'zijian-test-comfyui-model-svc'
  imageUrl: 'registry.us-east-1.aliyuncs.com/fc-demo2/zijian-test-sd:cap-comfyui-v15'
  role: 'acs:ram::1431999136518149:role/aliyundevsdefaultrole'
  gpuType: 'fc.gpu.tesla.1'

resources:
  comfyui:
    component: model
    props:
      region: '${vars.region}'
      name: '${vars.name}'
      description: 'ComfyUI 函数'
      logConfig: auto
      vpcConfig: auto
      nasConfig: auto
      httpTrigger: auto
      modelConfig:
        sourceType: custom-container
      role: '${vars.role}'
      environmentVariables:
        MNT_DIR: "/mnt/${vars.name}"

      # 实例规格
      timeout: 7200
      diskSize: 61440
      cpu: 8
      memorySize: 32768
      instanceConcurrency: 200
      gpuConfig:
        gpuMemorySize: 16384
        gpuType: '${vars.gpuType}'

      # 运行时
      runtime: custom-container
      customContainerConfig:
        port: 9000
        image: ${vars.imageUrl} 
        instanceConcurrency: 200


  gateway:
    component: fc3
    actions:
    props:
      region: '${vars.region}'
      functionName: '${vars.name}__gateway'
      description: '网关函数'
      timeout: 3600
      diskSize: 512
      runtime: custom
      cpu: 1
      memorySize: 1024
      instanceConcurrency: 200
      code: dist
      customRuntimeConfig:
        port: 9000
        command:
          - ./gateway
      environmentVariables:
        ENDPOINT: '${resources.comfyui.info.urlInternet}'
      customDomain:
        protocol: "HTTP"
        route:
          path: "/*"
          qualifier: "LATEST"
        domainName: auto