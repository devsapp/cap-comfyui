edition: 3.0.0 #  命令行YAML规范版本，遵循语义化版本（Semantic Versioning）规范
name: cap-comfyui
access: '{{ access }}'
vars:
  region: '{{ region }}'
  name: '{{ name }}'
  imageUrl: 'registry.{{ region }}.aliyuncs.com/ohyee/fc-demo:cap-comfyui-v14'
  gpuType: '{{ gpu }}'

resources:
  comfyui:
    component: fc3
    props:
      region: '${vars.region}'
      functionName: '${vars.name}'
      description: 'ComfyUI 函数'

      cpu: 8
      memorySize: 32768
      diskSize: 61440
      gpuConfig:
        gpuMemorySize: 16384
        gpuType: '{vars.gpuType}'

      runtime: custom-container
      customContainerConfig:
        image: ${vars.imageUrl}
        port: 9000

      timeout: 7200
      internetAccess: true
      instanceConcurrency: 200
      environmentVariables:
        MNT_DIR: '/mnt/${vars.name}'
      logConfig: auto
      vpcConfig: auto
      nasConfig: auto
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            authType: anonymous
            disableURLInternet: false
          triggerName: defaultTrigger
          description: ''
          qualifier: LATEST
          triggerType: http
